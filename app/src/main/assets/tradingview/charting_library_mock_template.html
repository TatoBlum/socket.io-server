<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html, body, #chart {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: sans-serif;
    }

    .missing-library {
      box-sizing: border-box;
      height: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      color: #1f2937;
      background: #f8fafc;
      line-height: 1.35;
    }

    .missing-library strong {
      font-size: 18px;
    }

    .missing-library code {
      color: #0f766e;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="chart"></div>
  <script src="/charting_library/charting_library.js"></script>
  <script>
    (function () {
      var config = {{CONFIG}};

      if (!window.TradingView || !window.TradingView.widget) {
        document.getElementById("chart").innerHTML =
          "<div class='missing-library'>" +
          "<strong>Falta TradingView Charting Library</strong>" +
          "<span>Copiá los assets licenciados en:</span>" +
          "<code>app/src/main/assets/tradingview/charting_library/</code>" +
          "<span>El datafeed mock ya está integrado en este HTML.</span>" +
          "</div>";
        return;
      }

      var bars = buildMockBars(config.basePrice, config.seed);
      var subscribers = {};

      var datafeed = {
        onReady: function (callback) {
          setTimeout(function () {
            callback({
              supports_search: false,
              supports_group_request: false,
              supports_marks: false,
              supports_timescale_marks: false,
              supports_time: true,
              supported_resolutions: ["1", "5", "15", "60", "1D"]
            });
          }, 0);
        },

        resolveSymbol: function (symbolName, onResolve) {
          setTimeout(function () {
            onResolve({
              name: config.symbol,
              ticker: config.symbol,
              full_name: config.symbol,
              description: config.description,
              type: "stock",
              session: config.session,
              timezone: config.timezone,
              exchange: config.exchange,
              listed_exchange: config.exchange,
              minmov: 1,
              pricescale: config.pricescale,
              has_intraday: true,
              has_daily: true,
              has_weekly_and_monthly: true,
              supported_resolutions: ["1", "5", "15", "60", "1D"],
              volume_precision: 0,
              currency_code: config.currencyCode,
              data_status: "streaming"
            });
          }, 0);
        },

        getBars: function (symbolInfo, resolution, periodParams, onHistory, onError) {
          try {
            var from = periodParams.from * 1000;
            var to = periodParams.to * 1000;
            var requestedBars = bars.filter(function (bar) {
              return bar.time >= from && bar.time <= to;
            });

            onHistory(requestedBars, { noData: requestedBars.length === 0 });
          } catch (error) {
            onError(error);
          }
        },

        subscribeBars: function (symbolInfo, resolution, onRealtime, subscriberUID) {
          var intervalId = setInterval(function () {
            var last = bars[bars.length - 1];
            var nextClose = round(last.close + pseudoRandom(config.seed + bars.length) * config.realtimeStep);
            var next = {
              time: Date.now(),
              open: last.close,
              high: Math.max(last.close, nextClose) + Math.abs(config.realtimeStep),
              low: Math.min(last.close, nextClose) - Math.abs(config.realtimeStep),
              close: nextClose,
              volume: last.volume + 250
            };

            bars[bars.length - 1] = next;
            onRealtime(next);
          }, config.pollingMs);

          subscribers[subscriberUID] = intervalId;
        },

        unsubscribeBars: function (subscriberUID) {
          if (subscribers[subscriberUID]) {
            clearInterval(subscribers[subscriberUID]);
            delete subscribers[subscriberUID];
          }
        }
      };

      new TradingView.widget({
        container: "chart",
        library_path: "/charting_library/",
        autosize: true,
        symbol: config.symbol,
        interval: config.interval,
        locale: config.locale,
        timezone: config.timezone,
        theme: config.theme,
        datafeed: datafeed,
        disabled_features: [
          "header_symbol_search",
          "symbol_search_hot_key",
          "items_favoriting"
        ],
        enabled_features: []
      });
    })();

    function buildMockBars(basePrice, seed) {
      var result = [];
      var dayMs = 24 * 60 * 60 * 1000;
      var now = Date.now();
      var firstDay = now - dayMs * 180;
      var previousClose = basePrice;

      for (var i = 0; i < 180; i++) {
        var drift = pseudoRandom(seed + i) * basePrice * 0.018;
        var open = previousClose;
        var close = Math.max(1, open + drift);
        var high = Math.max(open, close) + Math.abs(drift) * 0.45;
        var low = Math.max(1, Math.min(open, close) - Math.abs(drift) * 0.45);

        result.push({
          time: firstDay + i * dayMs,
          open: round(open),
          high: round(high),
          low: round(low),
          close: round(close),
          volume: 100000 + i * 1500
        });

        previousClose = close;
      }

      return result;
    }

    function pseudoRandom(value) {
      var x = Math.sin(value) * 10000;
      return (x - Math.floor(x) - 0.5) * 2;
    }

    function round(value) {
      return Math.round(value * 100) / 100;
    }
  </script>
</body>
</html>
