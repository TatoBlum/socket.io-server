<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src https://*.tradingview.com https://*.tradingview-widget.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://*.tradingview.com https://*.tradingview-widget.com; img-src 'self' data: https://*.tradingview.com https://*.tradingview-widget.com; connect-src https://*.tradingview.com https://*.tradingview-widget.com wss://*.tradingview.com wss://*.tradingview-widget.com; frame-src https://*.tradingview.com https://*.tradingview-widget.com; font-src data: https://*.tradingview.com https://*.tradingview-widget.com;" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html, body {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    tv-company-profile {
      display: block;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      const originalAttachShadow = Element.prototype.attachShadow;
      window.__tradingViewShadowRoots = [];
      Element.prototype.attachShadow = function (options) {
        const root = originalAttachShadow.call(this, options);
        window.__tradingViewShadowRoots.push(root);
        return root;
      };
    })();
  </script>
  <script type="module" src="{{SCRIPT_SRC}}"></script>
  <tv-company-profile {{CONFIG}}></tv-company-profile>
  <script>
    (function () {
      const widget = document.querySelector("tv-company-profile");
      const syncWidgetSize = function () {
        const height = window.innerHeight + "px";
        document.documentElement.style.height = height;
        document.body.style.height = height;
        widget.style.height = height;
        widget.style.minHeight = height;
      };
      syncWidgetSize();
      window.addEventListener("resize", syncWidgetSize);

      const localizedSector = widget.dataset.localizedSector;
      const localizedIndustry = widget.dataset.localizedIndustry;
      const localizedDescription = widget.dataset.localizedDescription;
      if (!localizedSector && !localizedIndustry && !localizedDescription) return;

      const normalizeLabel = function (text) {
        return text.trim().replace(/:$/, "").toLocaleLowerCase("es");
      };

      const replaceSummaryValue = function (labels, replacement) {
        if (!replacement) return;
        (window.__tradingViewShadowRoots || []).forEach(function (root) {
          root.querySelectorAll(".row").forEach(function (row) {
            const label = row.querySelector(".label");
            const value = row.querySelector(".value");
            if (label && value && labels.includes(normalizeLabel(label.textContent))) {
              value.textContent = replacement;
            }
          });
        });
      };

      const applyLocalization = function () {
        replaceSummaryValue(["sector"], localizedSector);
        replaceSummaryValue(["industria", "industry"], localizedIndustry);
        if (localizedDescription) {
          (window.__tradingViewShadowRoots || []).forEach(function (root) {
            root.querySelectorAll(".description").forEach(function (description) {
              if (description.textContent.trim().length > 0) {
                description.textContent = localizedDescription;
              }
            });
          });
        }
      };

      let localizationAttempts = 0;
      const localizeWhenReady = function () {
        applyLocalization();
        localizationAttempts += 1;
        if (localizationAttempts < 150) window.setTimeout(localizeWhenReady, 100);
      };
      localizeWhenReady();
    })();
  </script>
</body>
</html>
